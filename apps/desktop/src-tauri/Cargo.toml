[package]
name = "offline-intelligence-desktop"
version = "0.1.0"
description = "Offline Intelligence Desktop App"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { workspace = true, features = [] }
# Version pins only (see the pinned-internals block in the workspace Cargo.toml).
# Declared so the workspace `=` constraints actually bind on these transitives.
tauri-codegen = { workspace = true }
tauri-plugin = { workspace = true }

[dependencies]
tauri = { workspace = true, features = ["devtools"] }
tauri-plugin-shell = { workspace = true }
tauri-plugin-fs = { workspace = true }
tauri-plugin-dialog = { workspace = true }
# Version pins only (see the pinned-internals block in the workspace Cargo.toml).
# Declared so the workspace `=` constraints actually bind on these transitives.
# default-features = false there, so these add no features to the build.
tauri-runtime = { workspace = true }
tauri-runtime-wry = { workspace = true }
tauri-utils = { workspace = true }
tauri-macros = { workspace = true }
wry = { workspace = true }
tao = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
reqwest = { version = "0.12", features = ["json", "blocking"] }
dirs = "5"

# Platform-specific offline-intelligence dependency configuration
# Windows and Linux: Enable nvidia feature for GPU detection and monitoring (CUDA/NVML support)
# macOS: Use base features only (NVML not available on macOS, Metal GPU used instead)
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
offline-intelligence = { workspace = true, features = ["nvidia"] }

[target.'cfg(target_os = "macos")'.dependencies]
offline-intelligence = { workspace = true }
